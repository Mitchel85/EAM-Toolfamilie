name: Tests

on:
  push:
  pull_request:

jobs:
  script-maker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run deterministic test suite
        run: node tests/run_tests.js
