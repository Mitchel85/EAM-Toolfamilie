name: container

# Hält ghcr.io/mitchel85/eam-toolfamilie (:latest, :main, :v<version>, :sha-...)
# bei jedem grünen Push auf `main` und jedem `v*`-Tag automatisch synchron mit
# dem Python-Kern, der WebUI, GitHub Pages (`pages.yml`) und dem Release (`release.yml`).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-main
  cancel-in-progress: true

jobs:
  bauen:
    uses: ./.github/workflows/_build.yml

  container:
    runs-on: ubuntu-latest
    needs: bauen
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Versions-Tag bestimmen
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('packages/core/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
            tag="v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
