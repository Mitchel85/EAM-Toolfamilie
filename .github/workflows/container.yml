name: container

# Hält ghcr.io/mitchel85/eam-toolfamilie:latest (und :main) bei jedem grünen
# Push auf main automatisch synchron mit dem Python-Kern und der WebUI.
#
# Wie bei `pages.yml` läuft zuerst der geteilte Prüfablauf `_build.yml`:
# schlägt eine Prüfung oder ein Test fehl, bleibt das veröffentlichte Image
# unangetastet. Versions-Tags (`:vX.Y.Z`) schreibt weiterhin `release.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-main
  cancel-in-progress: true

jobs:
  bauen:
    uses: ./.github/workflows/_build.yml

  container:
    runs-on: ubuntu-latest
    needs: bauen
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
