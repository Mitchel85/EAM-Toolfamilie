name: bauen

# Ein Bau- und Prüfablauf für CI und Release.
#
# Vorher standen dieselben zehn Schritte in `ci.yml` und `release.yml`. Eine
# neue Prüfung landete dadurch leicht nur in einem der beiden Abläufe — der
# Release-Pfad lief dann ungeprüft weiter. Jetzt gibt es genau eine Stelle.
#
# Aufruf aus einem anderen Workflow:
#   jobs:
#     bauen:
#       uses: ./.github/workflows/_build.yml
# Danach liegt `dist/` als Artefakt `dist` bereit (download-artifact).

on:
  workflow_call:

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhaengigkeiten (nur Tests)
        run: python -m pip install --quiet -r requirements-dev.txt

      # Ohne --mdg: die Datei steht in packages/rules/CURRENT.
      - name: Wissensbasis gegen die Quelle pruefen
        run: python scripts/build_knowledge.py --check --check-provenance

      - name: Ein-Quellen-Regel (ein Leser, keine Kopien)
        run: python scripts/check_single_source.py

      - name: Abhaengigkeiten weiterreichen (Drift-Check)
        run: python scripts/propagate.py --check

      - name: HTML-Auslieferungen bauen
        run: |
          python scripts/build_legacy_app.py apps/html-suite
          python scripts/build_legacy_app.py apps/html-analyzer
          python scripts/build_legacy_app.py apps/html-editor
          python apps/mdg-web/build.py

      - name: Auslieferungsgraph (jede Zelle, jede Kante, jedes Artefakt)
        run: python scripts/verify_graph.py --md dist/GRAPH.md

      - name: Datei-Kanten im Manifest (Dependency Graph)
        run: python scripts/sync_dependency_files.py --check

      - name: Auslieferungen einsammeln
        run: python scripts/collect_releases.py

      - name: Graph gegen das Manifest
        run: python scripts/verify_graph.py

      - name: ADMBw-Werkzeuge pruefen
        run: |
          python apps/admbw-batch/checks/verify.py
          python apps/admbw-extractor/checks/verify.py

      - name: Open-WebUI-Werkzeug rauchtesten
        run: python apps/mcp/checks/verify_openwebui.py

      - name: Script-Maker-Tests
        run: node apps/admbw-script-maker/tests/run_tests.js

      - name: Kein Modellwissen im Anwendungscode
        run: python scripts/check_no_model_leak.py
      - name: Tests
        run: python -m pytest -q

      - name: Auslieferungen als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
