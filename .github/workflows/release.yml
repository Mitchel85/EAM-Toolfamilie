name: release

# Auf Tag v* entsteht ein Release mit allen herunterladbaren Auslieferungen
# und das Container-Image landet in der Registry. Kein docker login auf dem
# Server: die Registry-Anmeldung passiert hier mit GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # Release anlegen und Assets hochladen
  packages: write     # Image nach ghcr.io pushen

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhängigkeiten
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Wissensbasis gegen die Quelle prüfen
        run: python scripts/build_knowledge.py --mdg packages/rules/NAFv4-ADMBw-MDG-2026.05.xml --check --check-provenance

      - name: Ein-Quellen-Regel
        run: python scripts/check_single_source.py

      - name: Abhängigkeiten weiterreichen (Drift-Check)
        run: python scripts/propagate.py --check

      - name: Auslieferungen bauen
        run: |
          python scripts/build_legacy_app.py apps/html-suite
          python scripts/build_legacy_app.py apps/html-analyzer
          python scripts/build_legacy_app.py apps/html-editor
          python apps/mdg-web/build.py

      - name: Graph prüfen (jede Zelle, jedes Artefakt)
        run: python scripts/verify_graph.py --md dist/GRAPH.md

      - name: Alles nach dist/ einsammeln
        run: python scripts/collect_releases.py

      - name: Tests
        run: python -m pytest -q

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: "EAM Toolfamilie ${{ github.ref_name }}"
          body_path: dist/README.md
          files: |
            dist/EAM-AI-Suite.html
            dist/EAM-AI-Suite.aspx
            dist/EAM-QEA-Analyzer.html
            dist/EAM-QEA-Analyzer.aspx
            dist/EAM-Suite.html
            dist/EAM-Suite.aspx
            dist/EAM-MDG-Parser.html
            dist/eam_qea_analyzer_openwebui.py
            dist/eam-ai-suite-python-*.zip
            dist/eam-ai-suite-python.zip
            dist/START-HIER.html
            dist/README.md
            dist/RELEASES.md
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  container:
    runs-on: ubuntu-latest
    needs: bauen
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
