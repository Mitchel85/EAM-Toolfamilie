name: release

# Auf Tag v* entsteht ein Release mit allen herunterladbaren Auslieferungen
# und das Container-Image landet in der Registry. Kein docker login auf dem
# Server: die Registry-Anmeldung passiert hier mit GITHUB_TOKEN.
#
# Bauen und Prüfen laufen im geteilten Ablauf `_build.yml` — derselbe, den die
# CI benutzt. Ein Tag kann damit nicht an einer Prüfung vorbeikommen.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # Release anlegen und Assets hochladen
  packages: write     # Image nach ghcr.io pushen

jobs:
  bauen:
    uses: ./.github/workflows/_build.yml

  release:
    runs-on: ubuntu-latest
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Auslieferungen aus dem Baujob
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: "EAM Platform ${{ github.ref_name }}"
          body_path: dist/README.md
          files: |
            dist/EAM-AI-Suite.html
            dist/EAM-AI-Suite.aspx
            dist/EAM-Suite.html
            dist/EAM-Suite.aspx
            dist/EAM-MDG-Parser.html
            dist/eam_qea_analyzer_openwebui.py
            dist/eam-ai-suite-python-*.zip
            dist/eam-ai-suite-python.zip
            dist/START-HIER.html
            dist/README.md
            dist/RELEASES.md
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  container:
    runs-on: ubuntu-latest
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
