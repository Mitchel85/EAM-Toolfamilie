name: release

# Hält das GitHub-Release (`EAM Toolfamilie v<version>` / `/releases/latest`)
# bei jedem grünen Push auf `main` sowie bei jedem `v*`-Tag automatisch
# synchron mit GitHub Pages (`pages.yml`) und dem GHCR-Container (`container.yml`).
#
# Bauen und Prüfen laufen im geteilten Ablauf `_build.yml` — schlägt eine
# Prüfung oder ein Test fehl, bleibt das veröffentlichte Release unangetastet.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write     # Tag + Release anlegen/aktualisieren und Assets hochladen

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  bauen:
    uses: ./.github/workflows/_build.yml

  release:
    runs-on: ubuntu-latest
    needs: bauen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auslieferungen aus dem Baujob
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Ziel-Tag bestimmen (Tag oder pyproject.toml)
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            ver="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('packages/core/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
            tag="v${ver}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Ziel-Release: EAM Toolfamilie ${tag}"

      - name: Tag auf aktuellen Commit synchronisieren (bei Push auf main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "${{ steps.ver.outputs.tag }}" -m "EAM Toolfamilie ${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Release anlegen oder aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "EAM Toolfamilie ${{ steps.ver.outputs.tag }}"
          body_path: dist/README.md
          make_latest: true
          files: |
            dist/*.html
            dist/*.aspx
            dist/*.py
            dist/*.zip
            dist/README.md
            dist/RELEASES.md
            dist/SHA256SUMS
          fail_on_unmatched_files: true
