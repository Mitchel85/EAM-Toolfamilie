name: seite

# Veröffentlicht die Übersichtsseite als GitHub Pages.
#
# Warum ein eigener Ablauf: Pages braucht `pages: write` und `id-token: write`.
# Diese Rechte sollen nicht am Bau- und Prüfablauf hängen, denn der läuft auch
# beim Setzen eines Tags. Darum: erst `_build.yml` (bauen und prüfen), dann
# nur das fertige `dist/` veröffentlichen. Schlägt eine Prüfung fehl, bleibt
# die zuletzt veröffentlichte Seite stehen.
#
# Ergebnis: https://mitchel85.github.io/EAM-Toolfamilie/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seite
  cancel-in-progress: true

jobs:
  bauen:
    uses: ./.github/workflows/_build.yml

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Der Veröffentlichungs-Job startet ohne Arbeitskopie: er bekommt nur das
      # Artefakt `dist`. Für die amtliche MDG (packages/rules) braucht er das
      # Repository — sonst fehlt die Datei, die der Wächter pflegt.
      - name: Repository lesen
        uses: actions/checkout@v4

      - name: Auslieferungen holen
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Startseite plus englische Fassung. Keine Modelldateien, keine
      # Prüfsummen, keine Repository-Dateien.
      - name: Seitengerüst legen
        run: |
          set -eu
          mkdir -p seite
          cp dist/START-HIER.html seite/index.html
          # Damit die Adresse /START-HIER.html ebenfalls antwortet (alte Links).
          cp dist/START-HIER.html seite/START-HIER.html
          cp dist/EAM-Suite-en.html seite/EAM-Suite-en.html
          # Jede HTML-App läuft als einzelne Seite direkt im Browser.
          # ASPX-Fassungen gehören nach SharePoint/IIS, nicht auf Pages.
          for app in \
            eam-ai-suite:EAM-AI-Suite.html \
            eam-suite:EAM-Suite.html \
            admbw-extraktor:ADMBw-Extraktor.html \
            bpmn-studio:BPMN-Studio.html
          do
            ziel="${app%%:*}"
            quelle="${app##*:}"
            mkdir -p "seite/$ziel"
            cp "dist/$quelle" "seite/$ziel/index.html"
          done
          # Kein Jekyll: reines HTML, keine Verarbeitung nötig.
          touch seite/.nojekyll

          # Amtliche MDG für den Extraktor bereitstellen. Der Knopf im Werkzeug
          # lädt sie von hier (gleiche Herkunft — der Browser darf sie nicht
          # direkt vom BAAINBw holen, bundeswehr.de sendet keine CORS-Freigabe).
          # Die Datei ist dieselbe, die der Regelwerk-Wächter pflegt; das
          # Manifest belegt Version und Prüfsumme.
          mkdir -p seite/admbw-extraktor/mdg
          aktuell="$(tr -d '\r\n' < packages/rules/CURRENT)"
          cp "packages/rules/$aktuell" "seite/admbw-extraktor/mdg/$aktuell"
          python3 scripts/mdg_manifest.py "seite/admbw-extraktor/mdg/$aktuell" \
            --aus seite/admbw-extraktor/mdg/manifest.json

          ls -la seite

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: seite

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
